<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Manu's Ethnic Wear</title><link rel="stylesheet" href="/admin/admin.css"></head><body>
<div id="loginView" class="center"><form id="loginForm" class="panel login"><h1>Admin Login</h1><p>Manu's Ethnic Wear</p><input required type="email" name="email" placeholder="Admin email"><input required type="password" name="password" placeholder="Password"><button>Login</button><small id="loginMsg"></small></form></div>
<div id="dashboard" class="hidden"><header><div><strong>MANU'S ETHNIC WEAR</strong><span> Admin</span></div><button id="logout">Logout</button></header><main>
<section class="stats"><div><span>Orders</span><strong id="statOrders">0</strong></div><div><span>Revenue</span><strong id="statRevenue">$0</strong></div><div><span>Products</span><strong id="statProducts">0</strong></div><div><span>Enquiries</span><strong id="statEnquiries">0</strong></div></section>
<nav class="tabs"><button class="active" data-tab="orders">Orders</button><button data-tab="products">Products & Stock</button><button data-tab="enquiries">Enquiries</button></nav>
<section id="orders" class="tab panel"><h2>Orders</h2><div id="ordersList"></div></section>
<section id="products" class="tab panel hidden"><h2>Products & Inventory</h2><p class="muted">For sizes, enter values like S:8, M:12, L:10, XL:6. For a saree use FREE SIZE:15.</p><form id="productForm" class="gridform"><input required name="name" placeholder="Product name"><input required type="number" step="0.01" name="price" placeholder="Price"><select required name="category"><option>Men</option><option>Women</option><option>Kids</option></select><input required name="image" placeholder="Image URL"><input name="description" placeholder="Description"><input required name="variants" placeholder="Sizes & stock e.g. S:8,M:12,L:10"><button>Add product</button></form><div id="productsList"></div></section>
<section id="enquiries" class="tab panel hidden"><h2>Enquiries</h2><div id="enquiriesList"></div></section>
</main></div><script src="/admin/admin.js"></script></body></html>
